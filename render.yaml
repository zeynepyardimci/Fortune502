services:
  - type: web
    name: buzul-finops
    env: docker
    plan: free
    region: frankfurt
    healthCheckPath: /up
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
